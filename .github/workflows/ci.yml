# This file is maintained by Tedium - manual edits will be overwritten!
name: CI
"on":
  - push
jobs:
  check-root-js:
    runs-on: ubuntu-latest
    container:
      image: docker.io/node:25.9.0
    steps:
      - uses: markormesher/ci-resources/setup@v0.6.0
      - run: npm install -g --force yarn pnpm
      - env:
          CI_CACHE_TOKEN: ${{ secrets.CI_CACHE_TOKEN }}
        run: ./task -s cacheload-root-js
      - run: ./task -s deps-root-js
      - run: ./task -s lint-root-js
      - env:
          CI_CACHE_TOKEN: ${{ secrets.CI_CACHE_TOKEN }}
        run: ./task -s cachesave-root-js
  ci-all:
    runs-on: ubuntu-latest
    if: always()
    needs:
      - check-root-js
    container:
      image: docker.io/busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    steps:
      - run: |2
          results=$(echo '${{ toJson(needs) }}' | (grep '"result"' || echo))
          if echo "$results" | grep -q "failure\|cancelled\|skipped"; then
            echo "One or more jobs failed, were cancelled, or were skipped" >&2
            exit 1
          fi
          echo "All jobs passed"
